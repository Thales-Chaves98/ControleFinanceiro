<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro - Login</title>
    <link rel="stylesheet" href="assets/css/main.css">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <header>
        <span class="material-symbols-outlined logo">currency_exchange</span>
        <!--<button id="toggle-theme"><span class="material-symbols-outlined">moon_stars</span></button>-->
    </header>
    <main>
        <section class="login-card" id="login-card">
            <form class="login-form" id="login-form">
                <div class="input-field">
                    <label for="input-username">USUÁRIO:</label>
                    <input type="text" id="input-username">
                </div>
                <div class="input-field">
                    <label for="input-password">SENHA:</label>
                    <input type="password" id="input-password">
                </div>
                <button type="submit" class="btn-primary" id="login-btn">ENTRAR</button>
                <button type="button" class="btn-link" id="new-user-btn">NÃO POSSUI CADASTRO?</button>
                <p class="form-error hidden">USUÁRIO OU SENHA INVÁLIDOS !</p>
            </form>
        </section>

        <section class="login-card hidden" id="register-card">
            <form class="login-form" id="register-form">
                <div class="input-field">
                    <label for="create-username">USUÁRIO:</label>
                    <input type="text" id="create-username">
                </div>
                <div class="input-field">
                    <label for="create-password">SENHA:</label>
                    <input type="password" id="create-password">
                </div>
                <button type="submit" class="btn-primary" id="register-btn">CADASTRAR</button>
                <button type="button" class="btn-link" id="login-user-btn">JÁ POSSUI CADASTRO?</button>
                <p class="form-error hidden">USUÁRIO JÁ CADASTRADO !</p>
            </form>
        </section>

       
    </main>
</body>
</html>
